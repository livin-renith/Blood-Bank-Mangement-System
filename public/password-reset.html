<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>LifeFlow — Access Recovery & Password Reset</title>
  <link href="/css/app.css" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      "darkMode": "class",
      "theme": {
        "extend": {
          "colors": {
            "primary": "#094cb2",
            "primary-container": "#3366cc",
            "primary-fixed-dim": "#b1c5ff",
            "surface": "#faf9fa",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f5f3f4",
            "surface-container": "#efedee",
            "surface-container-high": "#e9e8e9",
            "on-surface": "#1b1c1d",
            "on-surface-variant": "#434653",
            "outline": "#737784",
            "outline-variant": "#c3c6d5",
            "secondary": "#5a5f63",
            "tertiary": "#6d5e00"
          },
          "fontFamily": {
            "headline": ["Noto Serif", "serif"],
            "body": ["Inter", "sans-serif"],
            "label": ["Public Sans", "sans-serif"]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-surface font-body text-on-surface">
  <main class="w-full min-h-screen flex items-center justify-center p-3 sm:p-6 bg-surface">
    <div class="flex flex-col w-full items-center justify-center py-6 sm:py-12 px-2 sm:px-4">
      <div class="w-full max-w-md bg-surface-container-lowest rounded-2xl shadow-xl p-5 sm:p-8 md:p-10 relative overflow-hidden border border-outline-variant/15">
        <!-- Ambient background glow -->
        <div class="absolute -top-24 -right-24 w-48 h-48 rounded-full bg-primary/5 blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-48 h-48 rounded-full bg-tertiary/10 blur-3xl pointer-events-none"></div>

        <!-- Header / Brand Emblem -->
        <div class="flex flex-col items-center text-center mb-8 relative z-10">
          <div class="w-16 h-16 rounded-2xl bg-primary/10 flex items-center justify-center text-primary mb-4 shadow-sm">
            <span class="material-symbols-outlined text-4xl">lock_reset</span>
          </div>
          <span class="font-label text-xs uppercase tracking-widest text-primary mb-1 font-bold">Credential Recovery</span>
          <h1 class="font-headline text-3xl font-normal text-on-surface tracking-tight">Reset Password</h1>
          <p class="text-sm text-secondary mt-1 max-w-xs">Verify your institutional email and assign a new secure credential.</p>
        </div>

        <form class="space-y-5 relative z-10" id="resetForm" onsubmit="event.preventDefault(); handleReset();">
          <!-- Email Field -->
          <div class="space-y-1.5">
            <label class="block font-label text-xs font-semibold uppercase tracking-wider text-on-surface-variant">Registered Email</label>
            <div class="relative">
              <input class="w-full bg-surface-container-lowest text-on-surface px-4 py-3 rounded-xl outline-none focus:ring-2 focus:ring-primary/50 transition-all text-sm border border-outline-variant/30" id="resetEmail" placeholder="admin.bloodbank@lifeflow.med" required="" type="email"/>
              <span class="absolute right-3 top-3 text-outline material-symbols-outlined text-xl pointer-events-none">mail</span>
            </div>
          </div>

          <!-- New Password Field -->
          <div class="space-y-1.5">
            <label class="block font-label text-xs font-semibold uppercase tracking-wider text-on-surface-variant">New Password</label>
            <div class="relative">
              <input class="w-full bg-surface-container-lowest text-on-surface px-4 py-3 rounded-xl outline-none focus:ring-2 focus:ring-primary/50 transition-all text-sm border border-outline-variant/30" id="newPassword" placeholder="Minimum 8 characters" required="" type="password"/>
              <span class="absolute right-3 top-3 text-outline material-symbols-outlined text-xl pointer-events-none">key</span>
            </div>
          </div>

          <!-- Submit Button -->
          <button class="w-full py-3.5 px-4 rounded-xl text-white font-medium text-sm transition-all shadow-md hover:opacity-95 active:scale-[0.99] flex items-center justify-center gap-2 bg-primary cursor-pointer" id="resetSubmitBtn" type="submit">
            <span>Update Password</span>
            <span class="material-symbols-outlined text-lg">check_circle</span>
          </button>
        </form>

        <div class="mt-8 pt-6 text-center border-t border-surface-container-high/50 relative z-10">
          <p class="text-xs text-secondary">
            Remembered your access details?
            <a class="text-primary font-medium hover:underline ml-1" href="/login">Return to sign in</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    async function handleReset() {
      const email = document.getElementById('resetEmail').value.trim();
      const newPassword = document.getElementById('newPassword').value;
      const btn = document.getElementById('resetSubmitBtn');

      btn.disabled = true;
      btn.innerHTML = `<span>Updating...</span>`;

      try {
        const res = await API.post('/api/auth/reset-password', { email, newPassword });
        if (res.success) {
          showToast('Password updated successfully! Redirecting to login...');
          setTimeout(() => {
            window.location.href = '/login';
          }, 1000);
        }
      } catch (err) {
        showToast(err.message || 'Error updating password', 'error');
        btn.disabled = false;
        btn.innerHTML = `<span>Update Password</span><span class="material-symbols-outlined text-lg">check_circle</span>`;
      }
    }
  </script>
</body>
</html>
