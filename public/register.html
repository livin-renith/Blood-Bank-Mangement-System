<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>LifeFlow — Clinical Staff Registry</title>
  <link href="/css/app.css" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      "darkMode": "class",
      "theme": {
        "extend": {
          "colors": {
            "primary": "#094cb2",
            "primary-container": "#3366cc",
            "primary-fixed": "#d9e2ff",
            "on-primary-fixed": "#001946",
            "surface": "#faf9fa",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f5f3f4",
            "surface-container": "#efedee",
            "surface-container-high": "#e9e8e9",
            "on-surface": "#1b1c1d",
            "on-surface-variant": "#434653",
            "outline": "#737784",
            "outline-variant": "#c3c6d5",
            "secondary": "#5a5f63",
            "tertiary": "#6d5e00"
          },
          "fontFamily": {
            "headline": ["Noto Serif", "serif"],
            "body": ["Inter", "sans-serif"],
            "label": ["Public Sans", "sans-serif"]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-surface font-body text-on-surface">
  <main class="w-full min-h-screen flex items-center justify-center p-6 bg-surface">
    <div class="flex flex-col w-full max-w-2xl mx-auto py-12 px-4 sm:px-6">
      <!-- Top Brand Bar -->
      <div class="flex items-center justify-between mb-8 pb-4 border-b border-outline-variant/15">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-primary flex items-center justify-center text-white shadow-md">
            <span class="material-symbols-outlined material-symbols-fill">water_drop</span>
          </div>
          <div>
            <span class="font-label text-xs uppercase tracking-widest text-primary font-semibold">LifeFlow Portal</span>
            <h2 class="font-headline text-lg text-on-surface">Clinical Staff Registry</h2>
          </div>
        </div>
        <div class="text-right hidden sm:block">
          <span class="font-label text-xs text-outline block">SECURE PROTOCOL</span>
          <span class="font-label text-xs text-tertiary font-medium">HIPAA COMPLIANT</span>
        </div>
      </div>

      <!-- Main Registration Card -->
      <div class="bg-surface-container-lowest rounded-2xl p-8 sm:p-12 shadow-xl border border-outline-variant/15 relative overflow-hidden">
        <div class="mb-10 text-center relative z-10">
          <h1 class="font-headline text-3xl sm:text-4xl text-on-surface mb-3">Create Professional Profile</h1>
          <p class="font-body text-secondary text-sm max-w-md mx-auto">
            Join the LifeFlow network for streamlined blood inventory management, secure requisitions, and emergency dispatch.
          </p>
        </div>

        <form class="space-y-6 relative z-10" id="registrationForm" onsubmit="event.preventDefault(); handleRegister();">
          <!-- Full Name -->
          <div class="space-y-2">
            <label class="font-label text-xs uppercase tracking-wider text-on-surface-variant font-semibold flex items-center gap-1.5">
              <span class="material-symbols-outlined text-sm text-primary">badge</span>
              Full Legal Name & Credentials *
            </label>
            <input class="w-full bg-surface-container-low text-on-surface px-4 py-3 rounded-xl text-sm transition-all focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary/40 placeholder:text-outline border border-outline-variant/20" id="regName" placeholder="e.g. Dr. Eleanor Vance, MD" required="" type="text"/>
          </div>

          <!-- Professional Email -->
          <div class="space-y-2">
            <label class="font-label text-xs uppercase tracking-wider text-on-surface-variant font-semibold flex items-center gap-1.5">
              <span class="material-symbols-outlined text-sm text-primary">mail</span>
              Institutional Email Address *
            </label>
            <input class="w-full bg-surface-container-low text-on-surface px-4 py-3 rounded-xl text-sm transition-all focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary/40 placeholder:text-outline border border-outline-variant/20" id="regEmail" placeholder="e.g. e.vance@lifeflow-hospital.org" required="" type="email"/>
          </div>

          <!-- Hospital / Blood Bank Affiliation -->
          <div class="space-y-2">
            <label class="font-label text-xs uppercase tracking-wider text-on-surface-variant font-semibold flex items-center gap-1.5">
              <span class="material-symbols-outlined text-sm text-primary">local_hospital</span>
              Hospital / Blood Bank Affiliation *
            </label>
            <div class="relative">
              <select class="w-full bg-surface-container-low text-on-surface px-4 py-3 rounded-xl text-sm transition-all focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary/40 appearance-none cursor-pointer border border-outline-variant/20" id="regInstitution" required="">
                <option value="St. Jude Metropolitan Medical Center">St. Jude Metropolitan Medical Center</option>
                <option value="Central Regional Blood Bank">Central Regional Blood Bank</option>
                <option value="Metro Metropolitan Trauma Institute">Metro Metropolitan Trauma Institute</option>
                <option value="Children's Specialized Hospital">Children's Specialized Hospital</option>
                <option value="City General Medical Center">City General Medical Center</option>
              </select>
              <span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
            </div>
          </div>

          <!-- Role Selection -->
          <div class="space-y-3">
            <label class="font-label text-xs uppercase tracking-wider text-on-surface-variant font-semibold flex items-center gap-1.5">
              <span class="material-symbols-outlined text-sm text-primary">admin_panel_settings</span>
              Designated System Role
            </label>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <label class="cursor-pointer relative">
                <input checked="" class="peer sr-only" name="role" type="radio" value="administrator"/>
                <div class="p-4 rounded-xl bg-surface-container-low peer-checked:bg-primary-fixed peer-checked:text-on-primary-fixed transition-all h-full flex flex-col justify-between hover:bg-surface-container border border-outline-variant/20">
                  <span class="material-symbols-outlined text-primary peer-checked:text-on-primary-fixed mb-2">security</span>
                  <div>
                    <span class="font-headline block text-sm font-semibold">Administrator</span>
                    <span class="font-body text-xs text-secondary peer-checked:text-on-primary-fixed/80">Full inventory & audits</span>
                  </div>
                </div>
              </label>
              <label class="cursor-pointer relative">
                <input class="peer sr-only" name="role" type="radio" value="staff"/>
                <div class="p-4 rounded-xl bg-surface-container-low peer-checked:bg-primary-fixed peer-checked:text-on-primary-fixed transition-all h-full flex flex-col justify-between hover:bg-surface-container border border-outline-variant/20">
                  <span class="material-symbols-outlined text-primary peer-checked:text-on-primary-fixed mb-2">badge</span>
                  <div>
                    <span class="font-headline block text-sm font-semibold">Staff</span>
                    <span class="font-body text-xs text-secondary peer-checked:text-on-primary-fixed/80">Logistics & testing</span>
                  </div>
                </div>
              </label>
              <label class="cursor-pointer relative">
                <input class="peer sr-only" name="role" type="radio" value="requester"/>
                <div class="p-4 rounded-xl bg-surface-container-low peer-checked:bg-primary-fixed peer-checked:text-on-primary-fixed transition-all h-full flex flex-col justify-between hover:bg-surface-container border border-outline-variant/20">
                  <span class="material-symbols-outlined text-primary peer-checked:text-on-primary-fixed mb-2">emergency</span>
                  <div>
                    <span class="font-headline block text-sm font-semibold">Requester</span>
                    <span class="font-body text-xs text-secondary peer-checked:text-on-primary-fixed/80">Hospital dispatches</span>
                  </div>
                </div>
              </label>
            </div>
          </div>

          <!-- Password Field -->
          <div class="space-y-2">
            <label class="font-label text-xs uppercase tracking-wider text-on-surface-variant font-semibold flex items-center gap-1.5">
              <span class="material-symbols-outlined text-sm text-primary">lock</span>
              Account Password *
            </label>
            <input class="w-full bg-surface-container-low text-on-surface px-4 py-3 rounded-xl text-sm transition-all focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary/40 placeholder:text-outline border border-outline-variant/20" id="regPassword" placeholder="Minimum 8 characters" required="" type="password"/>
          </div>

          <!-- Submit Button -->
          <button class="w-full py-4 px-6 rounded-xl bg-gradient-to-r from-primary to-primary-container text-white font-medium text-sm transition-all shadow-lg hover:shadow-primary/20 active:scale-[0.99] flex items-center justify-center gap-2 cursor-pointer" id="regSubmitBtn" type="submit">
            <span>Register Clinical Profile</span>
            <span class="material-symbols-outlined text-lg">arrow_forward</span>
          </button>
        </form>

        <div class="mt-8 pt-6 text-center border-t border-surface-container-high/50">
          <p class="text-xs text-secondary">
            Already possess active credentials?
            <a class="text-primary font-medium hover:underline ml-1" href="/login">Sign in to portal</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    async function handleRegister() {
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const institution = document.getElementById('regInstitution').value;
      const role = document.querySelector('input[name="role"]:checked')?.value || 'staff';
      const password = document.getElementById('regPassword').value;

      if (!name || !email || !password) {
        showToast('Please fill in all required fields.', 'error');
        return;
      }

      const btn = document.getElementById('regSubmitBtn');
      btn.disabled = true;
      btn.innerHTML = `<span>Creating Account...</span>`;

      try {
        const res = await API.post('/api/auth/register', { name, email, institution, role, password });
        if (res.success) {
          API.setToken(res.token);
          API.setUser(res.user);
          showToast(`Account created for ${res.user.name}! Redirecting to command center...`);
          setTimeout(() => {
            window.location.href = '/';
          }, 800);
        }
      } catch (err) {
        showToast(err.message || 'Registration failed.', 'error');
        btn.disabled = false;
        btn.innerHTML = `<span>Register Clinical Profile</span><span class="material-symbols-outlined text-lg">arrow_forward</span>`;
      }
    }
  </script>
</body>
</html>
